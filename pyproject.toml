[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bm-runner"
version = "2.1.0"
description = "Fixed-version local bulk RNA-seq DE, GSEA and ORA runner for BioMiner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "BioMiner", email = "2533752047@qq.com" }]
dependencies = [
    "pydeseq2==0.5.4",
    "anndata==0.12.19",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "psutil==7.1.3",
    "gseapy==1.3.0",
    "httpx>=0.27",
    "certifi>=2024.2.2",
]

[project.scripts]
bm_runner = "bm_runner.__main__:main"
biominer-client = "biominer_client.__main__:main"

[tool.setuptools]
packages = ["bm_runner", "biominer_client"]